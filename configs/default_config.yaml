project_name: "PlantVision"

data:
  dataset_dir: "data/PlantVillage"
  img_size: 224
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  # Strategy for imbalanced data, e.g., 'weighted_sampler', 'class_weights', or 'none'
  imbalance_strategy: "none" 

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 1e-4
  patience: 5 # For early stopping
  seed: 42
  device: "cuda" # 'cuda' or 'cpu'
  save_dir: "results"

models:
  # Models to run experiments on. Options: 'SimpleCNN', 'TransferResNet', 'VisionTransformer'
  selected:
    - "SimpleCNN"
    - "TransferResNet"
    - "VisionTransformer"
  
  SimpleCNN:
    learning_rate: 0.001
    dropout_rate: 0.3
    
  TransferResNet:
    learning_rate: 0.0001
    fine_tune_layers: 2 # Number of blocks to unfreeze at the end
    
  VisionTransformer:
    learning_rate: 0.0001
    model_name: "vit_b_16"
